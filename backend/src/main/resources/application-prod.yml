# AgentOps CRM - Production Environment Configuration
# Activate with: SPRING_PROFILES_ACTIVE=prod
#
# Vercel (frontend) calls this API cross-origin. Cookies use SameSite=None; Secure.
# The SPA also sends Authorization: Bearer from localStorage, which works even if
# the browser blocks third-party cookies.

server:
  forward-headers-strategy: framework

spring:
  # Override production-specific settings here

  # Database (use Railway environment variables)  
  # Railway provides: PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
# Or use custom: DB_URL, DB_USER, DB_PASSWORD
  datasource:
    url: ${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}}
    username: ${DB_USER:${PGUSER:postgres}}
    password: ${DB_PASSWORD:${PGPASSWORD:}}
    hikari:
      # Railway Starter: 5 max connections for small instance
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # Redis is not used. Auto-config is excluded in application.yml so Railway
  # does not need a Redis service.

  # JPA - Validate only, Flyway manages schema
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        default_schema: public

  # Flyway - enabled for production, NO baseline-on-migrate for fresh DB
  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
    out-of-order: false
    # Railway should start with empty DB - migrations run from V1

# Logging - INFO level for production, no SQL logging
logging:
  level:
    root: INFO
    com.agentopscrm: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN

# Actuator - Restricted access in production
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
    livenessstate:
      enabled: true

# CORS Configuration (production)
# Always includes https://*.vercel.app. Add the production custom domain here too.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

app:
  auth:
    cookie-secure: true
    cookie-same-site: None
    seed-demo-user: ${AUTH_SEED_DEMO_USER:true}

# No default — Railway must set JWT_SECRET or ProductionSecurityValidator refuses to start.
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION:86400000}
