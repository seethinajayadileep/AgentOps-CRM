# Used when the Railway service root is the monorepo.
# Prefer Root Directory = backend (then backend/railway.toml + backend/Dockerfile apply).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Liveness only — /actuator/health also checks the DB and returns 503 during Flyway.
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1

[env]
SPRING_PROFILES_ACTIVE = "prod"
